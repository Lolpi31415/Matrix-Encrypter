<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="encrypter-page">
<header class="title-bar">
    <div class="logo">TM 32-220</div>
    <nav class="nav-links">
        <a href="info.html">About</a>
        <a href="index.html">Encrypter</a>
        <a href="decrypt.html">Decrypter</a>
    </nav>
</header>

<div class="main">
<!--Information and page title-->
    <h2>TM 32-220 encrypter</h2>


    <h4>This encrypter uses a matrix as its encryption method. </h4>
<!--Actual encryption area-->
    <div class="encrypter">
        <textarea id="input" placeholder="Enter text to encrypt" rows="4" cols="50"></textarea>
        <label for="traversalMode">Select what method you would like to use:</label>
        <!--Allow user to select what type they want so its more secure-->
        <select id="traversalMode">
            <option value="columns">Columns (current)</option>
            <option value="diagonal">Diagonal zigzag</option>
            <option value="spiral">Clockwise spiral</option>
            <option value="shifted-columns">Columns shifted left by one</option>
        </select>
       <div class="notif"> <p>*Not recomended to use the spiral if there are lot of empty boxes filled with X's</p></div>
        <button id="button">Encrypt</button>        <div id="outputText">
            <textarea id="output" readonly rows="4" cols="50"></textarea>
        </div>

    </div>
    <!-- Display area for grid info -->
    <p id="gridInfo" style="font-weight: bold; color: #333;"></p>

    <!-- Visual Grid Container, will try to do-->
    <div id="matrixGridContainer"></div><br>

</div>
</body>
</html>
